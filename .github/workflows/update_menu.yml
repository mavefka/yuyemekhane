name: yemek menusu otomatik guncelleme

on:
  schedule:
    # Her gün Türkiye saati ile sabah 06:00'da çalışır (UTC saatine göre ayarlanmıştır)
    - cron: '0 3 * * *'
  workflow_dispatch: # İsterse elinle panelden de tetikleyebilirsin

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scraper Botunu Çalıştır
        run: python scraper.py

      - name: Değişen veri.json Dosyasını Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add veri.json
          git commit -m "Günlük otomatik menü güncellemesi: $(date +'%Y-%m-%d')" || exit 0
          git push